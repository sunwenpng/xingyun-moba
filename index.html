<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes">
<meta http-equiv="Cache-Control" content="no-cache">
<style>[hidden]{display:none!important}</style>
<title>星陨峡谷</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=ZCOOL+QingKe+HuangYou&display=swap">
<style>
/* Layout: one full-screen canvas battlefield; DOM overlays for menus (hero select, shop, pause, results). Single dark look by design. */
:root{
  --bg:#0a1120; --panel:#121b2e; --panel2:#1a2640; --line:rgba(160,190,255,.16);
  --fg:#e8edf6; --muted:#8d9ab2; --gold:#f2c35b; --gold2:#ffe39a;
  --blue:#4aa3ff; --red:#ff5d52;
  --display:"ZCOOL QingKe HuangYou","PingFang SC","Microsoft YaHei",sans-serif;
  --body:"PingFang SC","Hiragino Sans GB","Microsoft YaHei","Noto Sans SC",system-ui,sans-serif;
  color-scheme:dark;
}
html,body{height:100%;margin:0;overflow:hidden;background:var(--bg);color:var(--fg);font-family:var(--body)}
body{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));overscroll-behavior:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent}
#app{position:fixed;inset:0;overflow:hidden;background:var(--bg)}
#cv{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none}
#probe{position:fixed;visibility:hidden;pointer-events:none;padding:env(safe-area-inset-top,0px) env(safe-area-inset-right,0px) env(safe-area-inset-bottom,0px) env(safe-area-inset-left,0px)}
button{font-family:inherit;color:inherit;touch-action:manipulation;cursor:pointer}
button:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.coin{display:inline-block;width:.9em;height:.9em;border-radius:50%;background:radial-gradient(circle at 35% 35%,#fff3c4,var(--gold) 55%,#a8761c);box-shadow:0 0 0 1px rgba(0,0,0,.35) inset;vertical-align:-.1em}

/* in-game DOM buttons */
#hudBtns{position:absolute;top:calc(env(safe-area-inset-top,0px) + 8px);right:calc(env(safe-area-inset-right,0px) + 8px);display:flex;gap:8px}
.hbtn{height:36px;min-width:36px;padding:0 12px;border-radius:10px;border:1px solid var(--line);background:rgba(10,17,32,.72);font-size:14px;font-weight:700;display:flex;align-items:center;gap:6px;backdrop-filter:blur(4px)}
#btnShop b{color:var(--gold2);font-variant-numeric:tabular-nums}
#quickBuy{position:absolute;left:calc(env(safe-area-inset-left,0px) + 10px);top:42%;width:66px;padding:6px 4px 5px;border-radius:12px;border:1px solid rgba(242,195,91,.5);background:rgba(18,27,46,.82);display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11px}
#quickBuy .ico{width:34px;height:34px;border-radius:9px;display:grid;place-items:center;font-family:var(--display);font-size:20px;color:#fff}
#quickBuy .pr{color:var(--gold2);font-weight:700;font-variant-numeric:tabular-nums}
#quickBuy.cant{opacity:.55;border-color:var(--line)}

/* screens */
.screen{position:absolute;inset:0;overflow:auto;-webkit-overflow-scrolling:touch}
#menu{background:linear-gradient(100deg,rgba(8,13,26,.96) 0%,rgba(8,13,26,.78) 45%,rgba(8,13,26,.55) 100%)}
.menuWrap{min-height:100%;box-sizing:border-box;display:grid;grid-template-columns:minmax(220px,.85fr) minmax(0,1.5fr);gap:22px;align-items:center;padding:calc(env(safe-area-inset-top,0px) + 14px) max(18px,env(safe-area-inset-right,0px)) calc(env(safe-area-inset-bottom,0px) + 14px) max(18px,env(safe-area-inset-left,0px));max-width:1100px;margin:0 auto}
.eyebrow{font-size:11px;letter-spacing:.22em;color:var(--gold);font-weight:700}
.brand h1{font-family:var(--display);font-weight:400;font-size:clamp(40px,8vw,72px);line-height:1;margin:6px 0 8px;color:#fff;text-shadow:0 2px 0 #3a2a08,0 0 28px rgba(242,195,91,.35);letter-spacing:.04em}
.brand p{margin:0 0 14px;color:var(--muted);font-size:13px;line-height:1.6;max-width:30ch}
.diff{display:flex;gap:6px;margin-bottom:12px}
.diff button{flex:1;height:34px;border-radius:9px;border:1px solid var(--line);background:var(--panel);font-size:13px;font-weight:600;color:var(--muted)}
.diff button[aria-checked="true"]{border-color:var(--gold);color:var(--gold2);background:#2a2412}
.primary{width:100%;height:48px;border-radius:12px;border:0;background:linear-gradient(180deg,#ffd877,#e0a43a);color:#2b1a00;font-family:var(--display);font-size:24px;letter-spacing:.1em;box-shadow:0 4px 0 #8a5c12,0 8px 24px rgba(242,195,91,.25)}
.primary:active{transform:translateY(2px);box-shadow:0 2px 0 #8a5c12}
.hint{font-size:11px;color:var(--muted);margin-top:10px!important;line-height:1.6}
.picker{min-width:0;display:flex;flex-direction:column;gap:10px}
.heroRow{display:flex;gap:8px;overflow-x:auto;padding-bottom:2px}
.heroPick{flex:0 0 auto;width:74px;border-radius:12px;border:1px solid var(--line);background:rgba(18,27,46,.85);padding:6px 4px 6px;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:12px}
.heroPick canvas{width:52px;height:52px}
.heroPick small{color:var(--muted);font-size:10px}
.heroPick[aria-pressed="true"]{border-color:var(--gold);background:#272112;box-shadow:0 0 0 1px var(--gold) inset}
.heroCard{background:rgba(18,27,46,.9);border:1px solid var(--line);border-radius:14px;padding:12px 14px;min-width:0}
.hcHead{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.hcHead h2{font-family:var(--display);font-weight:400;font-size:28px;margin:0;color:#fff}
.hcHead .t{color:var(--muted);font-size:12px}
.chip{font-size:11px;padding:2px 8px;border-radius:99px;border:1px solid var(--line);color:var(--gold2)}
.hcDesc{font-size:12px;color:var(--muted);margin:4px 0 8px;line-height:1.5}
.bars{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:8px}
.bar{font-size:10px;color:var(--muted);letter-spacing:.08em}
.bar i{display:block;height:5px;border-radius:3px;background:rgba(255,255,255,.08);margin-top:3px;overflow:hidden}
.bar i b{display:block;height:100%;background:linear-gradient(90deg,var(--gold),var(--gold2))}
.skills{display:grid;gap:6px}
.sk{display:grid;grid-template-columns:28px 1fr;gap:8px;align-items:start}
.sk .k{width:28px;height:28px;border-radius:8px;display:grid;place-items:center;font-weight:800;font-size:12px;background:var(--panel2);border:1px solid var(--line)}
.sk .k.ult{color:var(--gold2);border-color:rgba(242,195,91,.5)}
.sk b{font-size:13px}
.sk span{display:block;font-size:11px;color:var(--muted);line-height:1.45}

.overlay{background:rgba(5,9,18,.78);display:grid;place-items:center;padding:calc(env(safe-area-inset-top,0px) + 12px) max(16px,env(safe-area-inset-right,0px)) calc(env(safe-area-inset-bottom,0px) + 12px) max(16px,env(safe-area-inset-left,0px));box-sizing:border-box}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:14px 16px;width:min(760px,100%);box-sizing:border-box;max-height:100%;overflow:auto}
.panel header{display:flex;align-items:center;gap:12px;margin-bottom:10px;flex-wrap:wrap}
.panel h2{font-family:var(--display);font-weight:400;font-size:26px;margin:0;color:#fff;flex:1}
.gold{font-weight:800;color:var(--gold2);font-variant-numeric:tabular-nums;font-size:16px}
.ghost{height:36px;padding:0 14px;border-radius:10px;border:1px solid var(--line);background:var(--panel2);font-size:13px;font-weight:700}
.owned{display:flex;gap:6px;margin-bottom:10px;flex-wrap:wrap}
.slot{width:44px;height:44px;border-radius:10px;border:1px dashed var(--line);display:grid;place-items:center;font-family:var(--display);font-size:20px;color:#fff;background:transparent;padding:0;position:relative}
.slot.full{border-style:solid}
.slot.sell::after{content:"出售";position:absolute;inset:0;border-radius:10px;background:rgba(255,93,82,.85);font-family:var(--body);font-size:12px;font-weight:800;display:grid;place-items:center}
.ownedLbl{font-size:11px;color:var(--muted);align-self:center;margin-left:4px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.item{display:grid;grid-template-columns:38px 1fr;gap:8px;align-items:center;text-align:left;padding:8px;border-radius:12px;border:1px solid var(--line);background:var(--panel2)}
.item .ico,.slot .ico{width:38px;height:38px;border-radius:9px;display:grid;place-items:center;font-family:var(--display);font-size:20px;color:#fff}
.item b{font-size:13px;display:block}
.item span{font-size:11px;color:var(--muted);display:block;line-height:1.35}
.item em{font-style:normal;font-size:12px;font-weight:800;color:var(--gold2);font-variant-numeric:tabular-nums}
.item em .coin{display:inline-block}
.item.cant{opacity:.5}
.item.rec{border-color:rgba(242,195,91,.7);box-shadow:0 0 0 1px rgba(242,195,91,.35) inset}
.item.rec b::after{content:" 推荐";font-size:10px;color:var(--gold)}
.pauseList{display:grid;gap:8px;max-width:340px;margin:0 auto}
.pauseList .ghost{height:44px;font-size:15px}
.help{font-size:12px;color:var(--muted);line-height:1.7;margin-top:10px;text-align:center}
.endTitle{font-family:var(--display);font-size:clamp(44px,10vw,80px);text-align:center;margin:0;line-height:1.1}
.endTitle.win{color:var(--gold2);text-shadow:0 0 30px rgba(242,195,91,.5)}
.endTitle.lose{color:#c9d2e3;text-shadow:0 0 30px rgba(255,93,82,.4)}
.endSub{text-align:center;color:var(--muted);font-size:13px;margin:2px 0 10px}
.tbl{width:100%;border-collapse:collapse;font-size:12px;font-variant-numeric:tabular-nums}
.tbl td,.tbl th{padding:4px 6px;text-align:left;border-bottom:1px solid var(--line)}
.tbl th{color:var(--muted);font-weight:600;font-size:11px}
.tbl tr.me td{color:var(--gold2);font-weight:700}
.tblWrap{display:grid;grid-template-columns:1fr 1fr;gap:12px;overflow-x:auto}
.endBtns{display:flex;gap:10px;margin-top:12px}
.endBtns .primary{flex:1;font-size:20px;height:44px}
.endBtns .ghost{flex:1;height:44px}
#rotate{position:absolute;inset:0;background:var(--bg);display:grid;place-items:center;text-align:center;padding:24px;box-sizing:border-box}
#rotate .ph{width:54px;height:90px;border:3px solid var(--gold);border-radius:12px;margin:0 auto 16px;animation:rot 2s ease-in-out infinite}
@keyframes rot{0%,20%{transform:rotate(0)}60%,100%{transform:rotate(-90deg)}}
@media (prefers-reduced-motion:reduce){#rotate .ph{animation:none}}
@media (max-width:640px),(max-aspect-ratio:1/1){.menuWrap{grid-template-columns:1fr;align-items:start}.tblWrap{grid-template-columns:1fr}}
@media (max-height:420px){.brand h1{font-size:44px}.brand p{display:none}.heroCard{padding:8px 12px}.hcDesc{margin:2px 0 6px}.sk span{font-size:10.5px}}
</style>

<div id="app">
  <canvas id="cv"></canvas>
  <div id="probe"></div>
  <div id="hudBtns" hidden>
    <button class="hbtn" id="btnShop" aria-label="打开商店"><span class="coin"></span><b id="goldTxt">0</b></button>
    <button class="hbtn" id="btnPause" aria-label="暂停">❚❚</button>
  </div>
  <button id="quickBuy" hidden aria-label="快速购买推荐装备"><div class="ico" id="qbIco"></div><div id="qbName">装备</div><div class="pr" id="qbPrice">0</div></button>

  <section id="menu" class="screen">
    <div class="menuWrap">
      <div class="brand">
        <div class="eyebrow">5V5 · 三路推塔 · 单机对战</div>
        <h1>星陨峡谷</h1>
        <p>选一位英雄，与四名队友并肩作战，推倒敌方防御塔，摧毁红色水晶。</p>
        <div class="diff" role="radiogroup" aria-label="电脑难度" id="diff">
          <button role="radio" data-d="easy" aria-checked="false">简单</button>
          <button role="radio" data-d="normal" aria-checked="true">普通</button>
          <button role="radio" data-d="hard" aria-checked="false">困难</button>
        </div>
        <button class="primary" id="startBtn">开始对战</button>
        <p class="hint">请横屏游玩。左侧拖动摇杆移动，右侧点攻击键普攻；技能键点按自动瞄准，按住拖动可手动瞄准，拖到「取消」处可放弃施法。</p>
      </div>
      <div class="picker">
        <div class="heroRow" id="heroRow"></div>
        <div class="heroCard" id="heroCard"></div>
      </div>
    </div>
  </section>

  <section id="shop" class="screen overlay" hidden>
    <div class="panel">
      <header><h2>军械库</h2><div class="gold"><span class="coin"></span> <span id="shopGold">0</span></div><button class="ghost" id="shopClose">返回战场</button></header>
      <div class="owned" id="owned"></div>
      <div class="grid" id="itemGrid"></div>
    </div>
  </section>

  <section id="pause" class="screen overlay" hidden>
    <div class="panel" style="width:min(420px,100%)">
      <header><h2>暂停</h2></header>
      <div class="pauseList">
        <button class="ghost" id="pResume">继续游戏</button>
        <button class="ghost" id="pAuto">托管：关</button>
        <button class="ghost" id="pMute">音效：开</button>
        <button class="ghost" id="pRestart">重新开始</button>
        <button class="ghost" id="pMenu">返回选英雄</button>
      </div>
      <p class="help">摇杆移动 · 攻击键自动选最近目标（优先英雄）<br>技能点按自动瞄准 · 拖动手动瞄准 · R 键 4 级解锁<br>「回城」3 秒后回到泉水回血 · 金币随时可在商店花掉<br>电脑键盘：WASD 移动 · 空格攻击 · 1234 技能（瞄准鼠标）· B 回城</p>
    </div>
  </section>

  <section id="end" class="screen overlay" hidden>
    <div class="panel">
      <h2 class="endTitle" id="endTitle">胜利</h2>
      <p class="endSub" id="endSub"></p>
      <div class="tblWrap" id="endTables"></div>
      <div class="endBtns"><button class="ghost" id="eMenu">更换英雄</button><button class="primary" id="eAgain">再来一局</button></div>
    </div>
  </section>

  <div id="rotate" hidden>
    <div><div class="ph"></div><p style="font-family:var(--display);font-size:26px;margin:0 0 6px">请把手机横过来</p><p style="color:var(--muted);font-size:13px;margin:0 0 16px">横屏视野更开阔，操作更舒服</p><button class="ghost" id="rotOk">仍然竖屏玩</button></div>
  </div>
</div>

<script>
(()=>{
'use strict';
// ================= constants & helpers =================
const S=3000, BLUE=0, RED=1, NEUT=2, TAU=Math.PI*2;
const TEAMC=['#4aa3ff','#ff5d52','#c9a0ff'];
const TEAMN=['蓝方','红方'];
const FONT='"PingFang SC","Hiragino Sans GB","Microsoft YaHei","Noto Sans SC",sans-serif';
const DFONT='"ZCOOL QingKe HuangYou","PingFang SC","Microsoft YaHei",sans-serif';
const WAVE_INT=26, GOLD_PS=3.2;
const rand=(a,b)=>a+Math.random()*(b-a);
const clamp=(v,a,b)=>v<a?a:v>b?b:v;
const dist=(a,b)=>Math.hypot(a.x-b.x,a.y-b.y);
const d2=(ax,ay,bx,by)=>{const dx=ax-bx,dy=ay-by;return dx*dx+dy*dy};
const angTo=(a,b)=>Math.atan2(b.y-a.y,b.x-a.x);
const isStruct=u=>u.kind==='tower'||u.kind==='nexus';
function segDist(px,py,ax,ay,bx,by){const vx=bx-ax,vy=by-ay,l=vx*vx+vy*vy;let t=l?((px-ax)*vx+(py-ay)*vy)/l:0;t=clamp(t,0,1);return Math.hypot(px-ax-vx*t,py-ay-vy*t)}
function pathLen(p){let L=0;for(let i=1;i<p.length;i++)L+=Math.hypot(p[i][0]-p[i-1][0],p[i][1]-p[i-1][1]);return L}
function pathAt(p,d){for(let i=1;i<p.length;i++){const sl=Math.hypot(p[i][0]-p[i-1][0],p[i][1]-p[i-1][1]);if(d<=sl){const f=d/sl;return{x:p[i-1][0]+(p[i][0]-p[i-1][0])*f,y:p[i-1][1]+(p[i][1]-p[i-1][1])*f}}d-=sl}const l=p[p.length-1];return{x:l[0],y:l[1]}}
function pathDistTo(p,x,y){let m=1e9;for(let i=1;i<p.length;i++)m=Math.min(m,segDist(x,y,p[i-1][0],p[i-1][1],p[i][0],p[i][1]));return m}

const LANES={
  top:[[330,2670],[300,1600],[340,340],[1400,300],[2670,330]],
  mid:[[330,2670],[1500,1500],[2670,330]],
  bot:[[330,2670],[1400,2700],[2660,2660],[2700,1600],[2670,330]]
};
const LANEK=['top','mid','bot'];
const LANEP=[{},{}];
for(const k of LANEK){LANEP[BLUE][k]=LANES[k];LANEP[RED][k]=LANES[k].slice().reverse();}
const TOWER_D={top:[820,1560],mid:[660,1160],bot:[820,1560]};
const NEXUS=[{x:360,y:2640},{x:2640,y:360}];
const BASET=[{x:600,y:2400},{x:2400,y:600}];
const FOUNT=[{x:165,y:2835},{x:2835,y:165}];

// ================= data =================
const D=(h,b,a,p,l)=>b+h.atk*a+h.ap*p+h.level*l;
const HEROES=[
 {id:'panshi',name:'磐石',title:'岩甲守卫',role:'坦克 · 开团',glyph:'磐',color:'#e8b277',dark:'#7a4a22',weapon:'#d6dbe3',lane:'top',ranged:false,range:105,r:31,
  hp:780,hpL:118,atk:60,atkL:4,armor:32,armorL:4.5,ap:0,apL:0,aspd:.75,ms:212,rate:[5,2,4],
  desc:'皮糙肉厚的岩石巨人。冲进敌阵震晕敌人，为队友创造机会。',
  build:['boots','orb','plate','heart','frost','glass'],
  skills:[
   {n:'裂地冲锋',k:'Q',cd:9,type:'dir',range:420,w:70,ai:'dir',d:'向前冲锋，撞击路径上的敌人造成伤害并眩晕 0.75 秒。',
    fn(h,a){dash(h,angTo(h,a),420,1350,e=>{hit(h,e,D(h,60,.7,0,12));stun(e,.75);burst(e.x,e.y,'#f3c58a',8)});sfxP(h,180,.15,'sawtooth',.06,.5)}},
   {n:'磐石之躯',k:'W',cd:13,type:'self',ai:'buff',d:'获得一层护盾（最大生命 10% + 成长），并提升 30% 移速，持续 2 秒。',
    fn(h){giveShield(h,120+h.maxHp*.1+h.level*20,3.5);buff(h,'ms',.3,2);fxRing(h.x,h.y,40,90,'#ffe0b0',.5);sfxP(h,320,.2,'triangle',.06,1.6)}},
   {n:'震荡波',k:'E',cd:7,type:'self',radius:270,ai:'aoe',d:'重踏地面，对周围敌人造成伤害并减速 40%，持续 2 秒。',
    fn(h){for(const e of enemiesIn(h.x,h.y,270,h.team)){hit(h,e,D(h,50,.6,0,14));slow(e,.4,2)}fxRing(h.x,h.y,40,270,'#f0c080',.45);shake(4);sfxP(h,90,.25,'square',.07,.4)}},
   {n:'山岳崩落',k:'R',cd:42,type:'point',range:560,radius:300,ai:'point',d:'召唤巨岩砸向目标区域，0.6 秒后造成大量伤害并眩晕 1.3 秒。',
    fn(h,a){const p=clampPt(h,a,560);telegraph(p.x,p.y,300,.6,h.team);later(.6,()=>{for(const e of enemiesIn(p.x,p.y,300,h.team)){hit(h,e,D(h,160,1,0,26));stun(e,1.3)}fxRing(p.x,p.y,60,320,'#ffcf8a',.6);fxCircle(p.x,p.y,300,'rgba(255,190,110,.35)',.5);burst(p.x,p.y,'#c89058',30);shake(9);sfxP(h,60,.5,'sawtooth',.1,.3)})}}
  ]},

function buildStructures(){
  for(const team of [BLUE,RED]){
    for(const lane of LANEK){
      const p=LANEP[team][lane];
      ['inner','outer'].forEach((tier,k)=>{
        const pos=pathAt(p,TOWER_D[lane][k]);
        const t=mkUnit({kind:'tower',team,lane,tier,x:pos.x,y:pos.y,r:46,maxHp:tier==='outer'?1800:2300,armor:40,atk:165,aspd:1,range:470,streak:0});
        t.hp=t.maxHp;G.units.push(t);G.struct[team][lane][tier]=t;
      });
    }
    const b=mkUnit({kind:'tower',team,lane:'mid',tier:'base',x:BASET[team].x,y:BASET[team].y,r:50,maxHp:2700,armor:45,atk:190,aspd:1,range:480,streak:0});
    b.hp=b.maxHp;G.units.push(b);G.struct[team].base=b;
    const n=mkUnit({kind:'nexus',team,x:NEXUS[team].x,y:NEXUS[team].y,r:72,maxHp:3600,armor:40});

  }
}

function mkHero(d,team,isPlayer){
  const F=FOUNT[team];
  const h=mkUnit({kind:'hero',def:d,team,isPlayer,name:d.name,x:F.x+rand(-60,60),y:F.y+rand(-60,60),r:d.r,range:d.range,ranged:d.ranged,aspd:d.aspd,
    level:1,xp:0,gold:450,goldTotal:450,items:[],kills:0,deaths:0,assists:0,cds:[0,0,0,0],order:null,lane:d.lane,state:'lane',aiT:Math.random()*.5,
    respawnAt:0,recallT:0,empower:0,multi:0,multiT:0,streak:0,manual:null,cs:0});
  recalc(h);h.hp=h.maxHp;G.heroes.push(h);G.units.push(h);return h;
}
function recalc(h){
  const d=h.def,L=h.level-1,s={hp:0,atk:0,ap:0,armor:0,aspd:0,ms:0,cdr:0,ls:0,regen:0};
  for(const id of h.items){const it=ITEM[id];for(const k in it.s)s[k]+=it.s[k]}
  const old=h.maxHp;
  h.maxHp=Math.round(d.hp+d.hpL*L+s.hp);h.atk=Math.round(d.atk+d.atkL*L+s.atk);h.ap=Math.round(d.ap+d.apL*L+s.ap);h.armor=Math.round(d.armor+d.armorL*L+s.armor);
  h.aspdBonus=s.aspd;h.msBase=d.ms+s.ms;h.cdr=Math.min(.4,s.cdr);h.ls=s.ls;h.regen=2.5+h.level*.5+s.regen;
  if(h.alive&&old)h.hp=Math.min(h.maxHp,h.hp+Math.max(0,h.maxHp-old));
}
const buffSum=(u,k)=>{let s=0;for(const b of u.buffs)if(b.k===k)s+=b.v;return s};
const effAspd=u=>Math.min(2.6,u.aspd*(1+(u.aspdBonus||0)+buffSum(u,'aspd')));
const effMs=u=>(u.msBase||u.ms)*(1+buffSum(u,'ms'))*(u.slowT>0?1-u.slowAmt:1);
const xpNeed=l=>80+l*55;

function isVuln(s){
  if(s.kind==='tower'){
    if(s.tier==='outer')return true;
    if(s.tier==='inner')return !G.struct[s.team][s.lane].outer.alive;
    if(s.tier==='base')return LANEK.some(l=>!G.struct[s.team][l].inner.alive);
  }
  if(s.kind==='nexus')return !G.struct[s.team].base.alive;
  return true;
}

function dealDamage(src,tgt,amt,o={}){
  if(!tgt.alive||amt<=0||G.over)return 0;
  if(tgt.invulnT>0)return 0;
  if(isStruct(tgt)&&!isVuln(tgt))return 0;
  let m=1;
  if(src&&src.kind==='hero'){m=G.dmgMul[src.team];if(G.bossBuff&&G.bossBuff[src.team]>G.time)m*=1.15}
  amt*=m*100/(100+Math.max(0,tgt.armor));
  if(tgt.shield>0){const a=Math.min(tgt.shield,amt);tgt.shield-=a;amt-=a}
  tgt.hp-=amt;tgt.hitFlash=.1;
  if(src&&src.kind==='hero'){
    tgt.lastDmg[src.id]=G.time;src.combatT=G.time;
    if(tgt.kind==='hero'){
      for(const t of G.units)if(t.kind==='tower'&&t.alive&&t.team===tgt.team&&d2(t.x,t.y,src.x,src.y)<(t.range+40)**2){t.aggro=src;t.aggroT=G.time+2.5}
    }
    if(o.basic&&src.ls)heal(src,amt*src.ls,true);
  }

function spawnWave(){
  G.wave++;

  for(const team of [BLUE,RED])for(const lane of LANEK){
    const types=['m','m','m','r','r'];if(G.wave%3===0||G.time>600)types.push('c');if(G.time>360)types.unshift('m');
    types.forEach((ty,i)=>{
      const p=pathAt(LANEP[team][lane],Math.max(70,230-i*48));
      const st=ty==='m'?{r:17,hp:390,atk:24,range:60,aspd:1,bounty:24,xpv:32,ranged:false}:ty==='r'?{r:15,hp:270,atk:30,range:340,aspd:.8,bounty:18,xpv:26,ranged:true}:{r:23,hp:820,atk:44,range:380,aspd:.7,bounty:50,xpv:60,ranged:true};
      const u=mkUnit({kind:'minion',mtype:ty,team,lane,path:LANEP[team][lane],wp:1,x:p.x+rand(-25,25),y:p.y+rand(-25,25),r:st.r,maxHp:st.hp*f,atk:st.atk*fa,armor:ty==='c'?20:8,
        aspd:st.aspd,range:st.range,ranged:st.ranged,ms:175,bounty:st.bounty,xpv:st.xpv,retarget:0});
      u.hp=u.maxHp;

function nearestAheadWp(p,x,y){let best=1,bd=1e9;for(let i=1;i<p.length;i++){const dd=segDist(x,y,p[i-1][0],p[i-1][1],p[i][0],p[i][1]);if(dd<bd){bd=dd;best=i}}return best}
function minionTarget(u){
  let best=null,bs=1e9;const ag=430;
  for(const e of G.units){
    if(!e.alive||e.team===u.team||e.team===NEUT)continue;
    const dd=Math.sqrt(d2(u.x,u.y,e.x,e.y))-e.r;if(dd>ag)continue;
    if(isStruct(e)&&!isVuln(e))continue;
    let sc=dd;if(e.kind==='hero'){sc+=e.aggroOn&&e.aggroOn>G.time?-80:160}if(isStruct(e))sc+=60;
    if(sc<bs){bs=sc;best=e}
  }

}
function updateMinion(u,dt){
  statusTick(u,dt);if(u.stun>0)return;
  u.retarget-=dt;
  if(!u.target||!u.target.alive||u.retarget<=0||d2(u.x,u.y,u.target.x,u.target.y)>600*600){u.target=minionTarget(u);u.retarget=.45}
  const t=u.target;
  if(t){if(!tryAttack(u,t)){const rng=u.range+t.r+u.r*.3;if(d2(u.x,u.y,t.x,t.y)>rng*rng)moveToward(u,t.x,t.y,dt)}}
  else{
    const p=u.path;if(u.wp>=p.length){return}
    const w=p[u.wp];moveToward(u,w[0],w[1],dt);
    if(d2(u.x,u.y,w[0],w[1])<60*60&&u.wp<p.length-1)u.wp++;
  }
}
function updateTower(t,dt){
  if(t.atkCd>0)t.atkCd-=dt;
  t.think=(t.think||0)-dt;
  const inR=e=>e&&e.alive&&!(e.invulnT>0)&&d2(t.x,t.y,e.x,e.y)<(t.range+e.r)**2;
  if(t.think<=0){
    t.think=.2;
    if(t.aggro&&t.aggroT>G.time&&inR(t.aggro)){t.target=t.aggro}
    else if(!inR(t.target)||t.target.kind==='hero'){
      let best=null,bd=1e9,bh=null,bhd=1e9;
      for(const e of G.units){if(!e.alive||e.team===t.team||e.team===NEUT||isStruct(e))continue;const dd=d2(t.x,t.y,e.x,e.y);if(dd>(t.range+e.r)**2)continue;
        if(e.kind==='minion'){if(dd<bd){bd=dd;best=e}}else if(e.kind==='hero'&&!(e.invulnT>0)){if(dd<bhd){bhd=dd;bh=e}}}
      const keepHero=t.target&&t.target.kind==='hero'&&inR(t.target);
      t.target=best||(keepHero?t.target:bh);
    }

  if(t.target&&t.atkCd<=0)tryAttack(t,t.target);
}
function updateMonster(u,dt){
  statusTick(u,dt);if(u.stun>0)return;

  if(u.target&&(!u.target.alive||home>520*520||G.time-u.aggroT>6)){u.target=null;u.leash=true}

  if(u.target){if(!tryAttack(u,u.target)){moveToward(u,u.target.x,u.target.y,dt)}}

function statusTick(u,dt){
  if(u.stun>0)u.stun-=dt;if(u.root>0)u.root-=dt;if(u.slowT>0)u.slowT-=dt;if(u.invulnT>0)u.invulnT-=dt;
  if(u.shieldT>0){u.shieldT-=dt;if(u.shieldT<=0)u.shield=0}
  if(u.atkCd>0)u.atkCd-=dt;if(u.hitFlash>0)u.hitFlash-=dt;
  if(u.buffs.length)u.buffs=u.buffs.filter(b=>b.t>G.time);

function moveToward(u,x,y,dt,mul=1){
  if(u.root>0||u.stun>0){u.vx=u.vy=0;return}
  const dx=x-u.x,dy=y-u.y,l=Math.hypot(dx,dy);if(l<2){u.vx=u.vy=0;return}
  const st=Math.min(l,effMs(u)*mul*dt);u.x+=dx/l*st;u.y+=dy/l*st;u.vx=dx/l*effMs(u);u.vy=dy/l*effMs(u);u.face=Math.atan2(dy,dx);
  u.x=clamp(u.x,30,S-30);u.y=clamp(u.y,30,S-30);
}

function dashTick(h,dt){

  if(l<=st){h.x=ds.tx;h.y=ds.ty;h.dash=null}else{h.x+=dx/l*st;h.y+=dy/l*st}
  if(ds.onHit)for(const e of enemiesIn(h.x,h.y,h.r+20,h.team)){if(ds.hit.has(e.id))continue;ds.hit.add(e.id);ds.onHit(e)}

function castSkill(h,i,aim){

function skillReady(h,i){return h.alive&&h.cds[i]<=0&&!(i===3&&h.level<4)}
function selectTarget(h,extra){

    if(sc<bs){bs=sc;best=e}

function autoAim(h,sk){

// ================= main update =================
function update(dt){
  if(G.over){G.time+=dt*.3;dt*=.3}else G.time+=dt;
  if(G.tip>0)G.tip-=dt;
  if(!G.over&&G.time>=G.nextWave){spawnWave();G.nextWave+=WAVE_INT}
  for(let i=G.timers.length-1;i>=0;i--){if(G.time>=G.timers[i].t){const f=G.timers[i].fn;G.timers.splice(i,1);f()}}
  for(const c of G.camps){if(!c.unit&&G.time>=c.respawnAt)spawnMonster(c)}
  for(const h of G.heroes){
    if(!h.alive){if(!G.over&&G.time>=h.respawnAt)respawn(h);continue}
    statusTick(h,dt);
    const g=GOLD_PS*G.goldMul[h.team]*dt;h.gold+=g;h.goldTotal+=g;giveXP(h,1.4*dt);
    h.hp=Math.min(h.maxHp,h.hp+h.regen*dt*(G.time-(h.combatT||-9)>5?2:1));
    for(let i=0;i<4;i++)if(h.cds[i]>0)h.cds[i]-=dt;
    if(h.recallT>0){h.recallT-=dt;if(h.recallT<=0){h.recallT=0;const F=FOUNT[h.team];fxRing(h.x,h.y,10,80,'#9fd0ff',.4);h.x=F.x;h.y=F.y;h.order=null;fxRing(h.x,h.y,80,10,'#9fd0ff',.4)}}
    if(G.over){h.order=null;continue}
    if(h===G.player)playerControl(h,dt);else heroAI(h,dt);
    if(h.dash)dashTick(h,dt);else heroAct(h,dt);
  }
  for(const u of G.units){
    if(!u.alive)continue;
    if(u.kind==='minion')updateMinion(u,dt);
    else if(u.kind==='tower'&&!G.over)updateTower(u,dt);
    else if(u.kind==='monster')updateMonster(u,dt);
  }
  // fountains
  for(const team of [BLUE,RED]){const F=FOUNT[team];
    for(const h of G.heroes){if(!h.alive)continue;const dd=d2(h.x,h.y,F.x,F.y);
      if(h.team===team&&dd<430*430){h.hp=Math.min(h.maxHp,h.hp+h.maxHp*.14*dt)}
      else if(h.team!==team&&dd<700*700){dealDamage(null,h,900*dt,{silent:true});if(Math.random()<.2)burst(h.x,h.y,TEAMC[team],2)}}}
  separate();
  updateProjs(dt);
  for(const p of G.parts){p.x+=p.vx*dt;p.y+=p.vy*dt;p.vx*=.92;p.vy*=.92;p.life-=dt}
  if(G.parts.length)G.parts=G.parts.filter(p=>p.life>0);
  G.fx=G.fx.filter(f=>G.time-f.t0<f.dur);
  for(const f of G.floats){f.y-=40*dt;f.life-=dt}G.floats=G.floats.filter(f=>f.life>0);
  if(G.units.length>0&&G.frame%30===0)G.units=G.units.filter(u=>u.alive||u.kind==='hero'||isStruct(u));
  G.frame=(G.frame||0)+1;
}
function separate(){
  const mob=[];for(const u of G.units)if(u.alive&&!isStruct(u))mob.push(u);
  for(let i=0;i<mob.length;i++){const a=mob[i];
    for(let j=i+1;j<mob.length;j++){const b=mob[j];const rr=(a.r+b.r)*.9,dx=b.x-a.x,dy=b.y-a.y,q=dx*dx+dy*dy;if(q>=rr*rr||q<.01)continue;
      const l=Math.sqrt(q),o=(rr-l)/2,nx=dx/l,ny=dy/l;
      const wa=a.dash?0:a.kind==='hero'?.4:1,wb=b.dash?0:b.kind==='hero'?.4:1;
      a.x-=nx*o*wa;a.y-=ny*o*wa;b.x+=nx*o*wb;b.y+=ny*o*wb}}
  for(const s of G.units){if(!s.alive||!isStruct(s))continue;
    for(const u of mob){const rr=s.r+u.r,dx=u.x-s.x,dy=u.y-s.y,q=dx*dx+dy*dy;if(q>=rr*rr)continue;const l=Math.sqrt(q)||1;u.x=s.x+dx/l*rr;u.y=s.y+dy/l*rr}}
}
function updateProjs(dt){
  for(const p of G.projs){
    if(p.homing){
      const t=p.t;if(!t.alive){p.dead=true;continue}
      const dx=t.x-p.x,dy=t.y-p.y,l=Math.hypot(dx,dy),st=p.speed*dt;
      if(l<=st+t.r*.5){p.dead=true;dealDamage(p.src,t,p.dmg,{basic:p.src.kind==='hero'});if(p.src===G.player||t===G.player)burst(t.x,t.y,p.color,3)}
      else{p.x+=dx/l*st;p.y+=dy/l*st;p.ang=Math.atan2(dy,dx)}
    }else{
      const st=Math.hypot(p.vx,p.vy)*dt;p.x+=p.vx*dt;p.y+=p.vy*dt;p.travel+=st;
      for(const e of G.units){
        if(!e.alive||e.team===p.team||isStruct(e)||p.hitSet.has(e.id))continue;
        if(d2(e.x,e.y,p.x,p.y)<(e.r+p.w*.5)**2){p.hitSet.add(e.id);p.onHit(e);if(!p.pierce||(p.stopHero&&e.kind==='hero')){p.dead=true;break}}
      }
      if(p.travel>=p.range||p.x<-50||p.y<-50||p.x>S+50||p.y>S+50)p.dead=true;
    }
  }
  G.projs=G.projs.filter(p=>!p.dead);
}

  <p class="hcDesc">${d.desc}</p>
  <div class="bars">${d.rate.map((v,i)=>`<div class="bar">${lab[i]}<i><b style="width:${v*20}%"></b></i></div>`).join('')}</div>
  <div class="skills">${d.skills.map(s=>`<div class="sk"><div class="k ${s.k==='R'?'ult':''}">${s.k}</div><div><b>${s.n}</b> <small style="color:var(--muted);font-size:10px">冷却 ${s.cd}s</small><span>${s.d}</span></div></div>`).join('')}</div>`;
}
document.querySelectorAll('#diff button').forEach(b=>b.onclick=()=>{selDiff=b.dataset.d;document.querySelectorAll('#diff button').forEach(x=>x.setAttribute('aria-checked',x===b))});
function startGame(){
  initAudio();
  try{const el=document.documentElement;if(el.requestFullscreen&&!document.fullscreenElement&&matchMedia('(pointer:coarse)').matches){el.requestFullscreen().then(()=>{try{screen.orientation&&screen.orientation.lock&&screen.orientation.lock('landscape').catch(()=>{})}catch(e){}}).catch(()=>{})}}catch(e){}
  try{navigator.wakeLock&&navigator.wakeLock.request('screen').catch(()=>{})}catch(e){}
  newGame();state='play';qbLast='';
  $('menu').hidden=true;$('end').hidden=true;$('pause').hidden=true;$('shop').hidden=true;$('hudBtns').hidden=false;$('quickBuy').hidden=false;
  $('pAuto').textContent='托管：关';
  checkRotate();sfx(330,.2,'triangle',.05,2);
}
$('startBtn').onclick=startGame;
function toMenu(){state='menu';G=null;$('menu').hidden=false;$('end').hidden=true;$('pause').hidden=true;$('shop').hidden=true;$('hudBtns').hidden=true;$('quickBuy').hidden=true;$('rotate').hidden=true}
function openPause(){if(!G||G.over)return;G.paused=true;$('pause').hidden=false;P.joy=P.atk=P.sk=null}
function resume(){if(!G)return;G.paused=false;$('pause').hidden=true;$('shop').hidden=true;last=performance.now()}
$('btnPause').onclick=openPause;$('pResume').onclick=resume;
$('pRestart').onclick=()=>{startGame()};$('pMenu').onclick=toMenu;
$('pMute').onclick=()=>{muted=!muted;$('pMute').textContent='音效：'+(muted?'关':'开')};
$('pAuto').onclick=()=>{G.auto=!G.auto;$('pAuto').textContent='托管：'+(G.auto?'开':'关');if(!G.auto)G.player.order=null};
$('eAgain').onclick=startGame;$('eMenu').onclick=toMenu;
$('rotOk').onclick=()=>{portraitOk=true;checkRotate()};
function checkRotate(){const el=$('rotate');if(!el)return;el.hidden=!(state==='play'&&H>W&&!portraitOk)}

let sellIdx=-1;
function openShop(){if(!G||G.over)return;G.paused=true;sellIdx=-1;$('shop').hidden=false;P.joy=P.atk=P.sk=null;renderShop()}
function renderShop(){
  const h=G.player,rec=nextBuild(h);
  $('shopGold').textContent=Math.floor(h.gold);
  const ow=$('owned');ow.innerHTML='';
  for(let i=0;i<6;i++){const id=h.items[i];const b=document.createElement('button');b.className='slot'+(id?' full':'')+(i===sellIdx?' sell':'');
    if(id){const it=ITEM[id];b.innerHTML=`<div class="ico" style="background:${it.c}">${it.g}</div>`;b.setAttribute('aria-label',`${it.n}，点两次出售`);b.onclick=()=>{if(sellIdx===i){sellItem(h,i);sellIdx=-1}else sellIdx=i;renderShop()}}
    else{b.disabled=true}
    ow.appendChild(b)}
  const lbl=document.createElement('span');lbl.className='ownedLbl';lbl.textContent=sellIdx>=0?`再点一次出售，返还 ${Math.round(ITEM[h.items[sellIdx]].p*.6)} 金币`:'点两次已购装备可出售（返还 60%）';ow.appendChild(lbl);
  const gr=$('itemGrid');gr.innerHTML='';
  for(const it of ITEMS){const b=document.createElement('button');const can=h.gold>=it.p&&h.items.length<6;b.className='item'+(can?'':' cant')+(rec&&rec.id===it.id?' rec':'');
    b.innerHTML=`<div class="ico" style="background:${it.c}">${it.g}</div><div><b>${it.n}</b><span>${it.d}</span><em><span class="coin"></span> ${it.p}</em></div>`;
    b.onclick=()=>{sellIdx=-1;if(buyItem(h,it.id))renderShop();else{b.animate&&b.animate([{transform:'translateX(-4px)'},{transform:'translateX(4px)'},{transform:'none'}],{duration:180})}};gr.appendChild(b)}
}
$('btnShop').onclick=openShop;$('shopClose').onclick=resume;
$('quickBuy').onclick=()=>{if(!G||G.over)return;const it=nextBuild(G.player);if(it&&!buyItem(G.player,it.id))floatTxt(G.player.x,G.player.y-50,`还差 ${Math.ceil(it.p-G.player.gold)} 金币`,'#ffb3a8',14)};
let qbLast='';
function updateDomHud(){
  if(!G)return;const h=G.player;$('goldTxt').textContent=Math.floor(h.gold);
  const it=nextBuild(h);const key=it?it.id+(h.gold>=it.p):'none';
  if(key!==qbLast){qbLast=key;const q=$('quickBuy');if(!it||h.items.length>=6){q.hidden=true}else{q.hidden=false;$('qbIco').textContent=it.g;$('qbIco').style.background=it.c;$('qbName').textContent=it.n;$('qbPrice').textContent=it.p;q.classList.toggle('cant',h.gold<it.p)}}
}
function showEnd(){
  if(!G)return;const win=G.winner===G.player.team;
  $('endTitle').textContent=win?'胜利':'失败';$('endTitle').className='endTitle '+(win?'win':'lose');
  const tm=Math.floor(G.overT);$('endSub').textContent=`对局时长 ${tm/60|0} 分 ${tm%60} 秒 · 比分 ${G.score[0]} : ${G.score[1]} · 难度 ${({easy:'简单',normal:'普通',hard:'困难'})[G.diff]}`;
  const tb=team=>`<table class="tbl"><thead><tr><th style="color:${TEAMC[team]}">${TEAMN[team]}</th><th>等级</th><th>击杀/死亡/助攻</th><th>补刀</th><th>经济</th></tr></thead><tbody>${G.heroes.filter(x=>x.team===team).map(x=>`<tr class="${x.isPlayer?'me':''}"><td>${x.isPlayer?'你 · ':''}${x.name}</td><td>${x.level}</td><td>${x.kills}/${x.deaths}/${x.assists}</td><td>${x.cs}</td><td>${Math.floor(x.goldTotal)}</td></tr>`).join('')}</tbody></table>`;
  $('endTables').innerHTML=tb(0)+tb(1);
  $('end').hidden=false;$('hudBtns').hidden=true;$('quickBuy').hidden=true;state='end';
}

// ================= loop =================
let last=performance.now(),acc=0;
function frame(now){
  let dt=Math.min(.05,(now-last)/1000);last=now;
  if(G&&state!=='menu'&&!G.paused){
    acc+=dt;const step=1/60;let n=0;while(acc>=step&&n<4){update(step);acc-=step;n++}if(n===4)acc=0;
    updateDomHud();
  }
  render();
  requestAnimationFrame(frame);
}
window.addEventListener('resize',()=>{resize()});
document.addEventListener('visibilitychange',()=>{if(document.hidden&&G&&state==='play'&&!G.paused&&!G.over)openPause()});
buildGround();resize();buildMenu();requestAnimationFrame(frame);
// debug hook for testing
window.__moba={get G(){return G},start:(id,d)=>{if(id)selHero=id;if(d)selDiff=d;startGame()},sim:(sec,auto=true)=>{if(!G)return;G.auto=auto;const n=Math.round(sec*30);for(let i=0;i<n&&!G.over;i++)update(1/30);return{time:G.time|0,over:G.over,winner:G.winner,score:G.score.slice(),lvl:G.player.level,towers:G.units.filter(u=>u.kind==='tower'&&u.alive).map(u=>u.team).join('')}}};
})();
</script>

</html>
